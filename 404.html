<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Raghav Upadhyay</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#09090b">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='28' cy='30' r='8' fill='%232ce6a0'/><circle cx='72' cy='26' r='8' fill='%232dd4ff'/><circle cx='50' cy='66' r='8' fill='%235b8cff'/><path d='M28 30 L72 26 L50 66 Z' stroke='%235b8cff' stroke-width='4' fill='none' stroke-opacity='0.7'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --text: #fafafa;
      --text-dim: #a1a1aa;
      --grad: linear-gradient(120deg, #5b8cff 0%, #2dd4ff 100%);
      --border: #27272a;
      --font-display: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-display);
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .code {
      font-family: var(--font-mono);
      font-size: clamp(4rem, 16vw, 8rem);
      font-weight: 600;
      line-height: 1;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 0 0 0.5rem;
    }
    h1 {
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      font-weight: 500;
      margin: 0 0 0.75rem;
    }
    p {
      color: var(--text-dim);
      max-width: 32rem;
      margin: 0 0 2rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      background: var(--grad);
      color: #09090b;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
      transition: opacity 0.2s ease;
    }
    .btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <p class="code" aria-hidden="true">404</p>
  <h1>This route doesn't retrieve anything.</h1>
  <p>No document in the index matches that path. Head back and try a section that actually exists.</p>
  <a href="/" class="btn">Back to home</a>
</body>
</html>
